<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nanoframe</title>
    <meta
      name="description"
      content="Nanoframe — Bring your product to life with satisfying visuals and cinematic 3D animations."
    />

    <!-- Body font: Google Sans Flex (official Google Fonts variable font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="svg/logo.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ===================================================================
     Hidden SVG filter definitions: this is what powers the procedural
     background. feTurbulence + feDisplacementMap = the "Turbulent
     Displace" effect from After Effects, applied to the moving
     4-colour gradient blobs behind it.
==================================================================== -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter
          id="turbulent-displace"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.010 0.018"
            numOctaves="2"
            seed="7"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="120"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <!-- Procedural infinite wave background -->
    <div class="bg-wave" aria-hidden="true">
      <div class="bg-wave__inner">
        <span class="blob blob--a"></span>
        <span class="blob blob--b"></span>
        <span class="blob blob--c"></span>
        <span class="blob blob--d"></span>
      </div>
    </div>

    <main class="hero">
      <!-- Logo lockup: circle mark + wordmark -->
      <div class="logo-row" id="logoRow">
        <div class="logo-circle-slot" id="circleSlot">
          <div class="logo-circle-pos" id="circlePos">
            <div class="logo-circle-spin" id="circleSpin">
              <svg class="circle-mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nanoframe mark">
                <g id="blade">
                  <path d="M 61.0 18.9 L 135.3 94.4 L 176.2 54.8 A 90 90 0 0 0 61.0 18.9 Z"/>
                </g>
                <use href="#blade" transform="rotate(90 100 100)"/>
                <use href="#blade" transform="rotate(180 100 100)"/>
                <use href="#blade" transform="rotate(270 100 100)"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="logo-text-mask" id="textMask">
          <span class="logo-text">NANOFRAME</span>
        </div>
      </div>

      <!-- Tagline -->
      <p class="tagline" id="tagline">
        Bring your product to life with satisfying visuals and cinematic 3D
        animations.
      </p>

      <!-- Contact / social row -->
      <nav
        class="links-row"
        id="linksRow"
        aria-label="Contact and social links"
      >
        <span class="links-group">
          <span class="links-label">Get in touch:</span>

          <a
            class="icon-btn"
            href="mailto:nanoframe.studio@gmail.com"
            aria-label="Email us"
          >
            <img src="./svg/icon-mail.svg" alt="" class="icon-img" />
          </a>

          <a
            class="icon-btn"
            href="https://www.fiverr.com/matinur_"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Hire us on Fiverr"
          >
            <img src="./svg/icon-fiverr.svg" alt="" class="icon-img" />
          </a>

          <a
            class="icon-btn"
            href="https://www.linkedin.com/company/nanoframe-studio/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Connect with us on Linked In"
          >
            <img src="./svg/icon-linkedin.svg" alt="" class="icon-img" />
          </a>
        </span>

        <span class="links-divider" aria-hidden="true"></span>

        <span class="links-group">
          <span class="links-label">See our work:</span>

          <a
            class="icon-btn"
            href="https://www.instagram.com/nanoframe.studio/"
            target="_blank"
            rel="noopener"
            aria-label="Instagram"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="3.5"
                y="3.5"
                width="17"
                height="17"
                rx="5"
                stroke="#FFFFFF"
                stroke-width="1.7"
              />
              <circle
                cx="12"
                cy="12"
                r="4.3"
                stroke="#FFFFFF"
                stroke-width="1.7"
              />
              <circle cx="17.1" cy="6.9" r="1.1" fill="#FFFFFF" />
            </svg>
          </a>

          <a
            class="icon-btn"
            href="https://www.tiktok.com/@nanoframe.studio"
            target="_blank"
            rel="noopener"
            aria-label="TikTok"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M14 3.5c.5 2.2 2 3.7 4.2 3.9v2.9c-1.5.1-2.9-.4-4.2-1.3v6.2a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.07v3a2.6 2.6 0 1 0 1.8 2.5V3.5H14Z"
                fill="#FFFFFF"
              />
            </svg>
          </a>

          <a
            class="icon-btn icon-btn--yt"
            href="https://www.youtube.com/@NanoFrame.Studio"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="2.5"
                y="5.5"
                width="19"
                height="13"
                rx="4"
                fill="#FFFFFF"
              />
              <path d="M10.3 9.3v5.4l4.8-2.7-4.8-2.7Z" fill="#1D1D1D" />
            </svg>
          </a>

          <a
            class="icon-btn"
            href="https://www.facebook.com/nanoframe.studio/"
            target="_blank"
            rel="noopener"
            aria-label="Facebook"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="9.5" fill="#FFFFFF" />
              <path
                d="M13.6 20v-6.5h2.2l.3-2.6h-2.5V9.2c0-.75.2-1.26 1.28-1.26h1.37V5.62c-.24-.03-1.05-.1-1.99-.1-1.97 0-3.32 1.2-3.32 3.41v1.9H8.7v2.6h2.29V20h2.6Z"
                fill="#1D1D1D"
              />
            </svg>
          </a>
        </span>
      </nav>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
